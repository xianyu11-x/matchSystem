[package]
name = "matchscope-desktop"
version = "0.1.0"
description = "Windows desktop shell for the MatchScope simulator"
authors = ["MatchSystem"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"
matchscope-updater = { path = "../updater" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Enables Tauri's custom protocol in release builds.  The Tauri CLI supplies
# this feature for production builds; development keeps the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
