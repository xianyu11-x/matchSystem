[package]
name = "matchscope-desktop"
version = "0.1.0"
description = "Windows desktop shell for the MatchScope simulator"
authors = ["MatchSystem"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"

[features]
# Enables Tauri's custom protocol in release builds.  The Tauri CLI supplies
# this feature for production builds; development keeps the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
